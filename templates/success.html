<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<style>
    .success-container{ display:flex; justify-content:center; align-items:center; height:100vh; background:#f4f7f6; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    .success-card{ background:white; padding:40px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center; max-width:400px; width:90%; }
    
    /* checkmark animation */
    .checkmark{ width:80px; height:80px; stroke:#4bb543; margin:auto; display:block; stroke-width:2; animation:scale .3s ease-in-out .9s both; }
    .checkmark__circle{ stroke-dasharray:166; stroke-dashoffset:166; stroke:#4bb543; animation:stroke .6s forwards; }
    .checkmark__check{ stroke-dasharray:48; stroke-dashoffset:48; animation:stroke .3s .8s forwards; }
    
    @keyframes stroke{100%{stroke-dashoffset:0}}
    @keyframes scale{50%{transform:scale(1.1)}}
    
    .btn-continue{ background:#4bb543; color:white; border:none; padding:12px 30px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:15px; }
    .btn-continue:hover{ background:#3e9637; }
</style>
</head>
<body>

<div class="success-container">
  <div class="success-card">
    <div class="icon-circle">
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
    </div>
    <h2>Verified!</h2>
    <p>Your OTP has been successfully validated.</p>
    <p style="font-size:13px;color:#999">Redirecting to dashboard...</p>

    <button class="btn-continue" onclick="goDashboard()">
      Enjoy Netflix
    </button>
  </div>
</div>

<script>
    // check token
    const token = localStorage.getItem("token")

    if(!token){
        alert("Session expired. Please login again")
        window.location.href="/login"
    }

    // button redirect
    function goDashboard(){
        window.location.href="/dashbord"
    }

    // auto redirect
    setTimeout(()=>{
        window.location.href="/dashbord"
    },3000)
</script>

</body>
</html>
